name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Export Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot installation
        shell: pwsh
        run: |
          godot --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import project and validate main scene
        shell: pwsh
        run: |
          godot --headless --editor --path "${{ github.workspace }}" --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          godot --headless --path "${{ github.workspace }}" --quit-after 5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Windows executable
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $buildDir = Join-Path $workspace "build"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          $exe = Join-Path $buildDir "Gielinor-Survivors.exe"
          $pck = Join-Path $buildDir "Gielinor-Survivors.pck"

          godot --headless --path $workspace --export-release "Windows Desktop" $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Windows export did not produce the EXE at $exe" }
          if (!(Test-Path -LiteralPath $pck -PathType Leaf)) { throw "Windows export did not produce the PCK at $pck" }

          Write-Host "Build workspace: $workspace"
          Get-ChildItem -LiteralPath $buildDir | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Gielinor-Survivors-Windows
          path: |
            ${{ github.workspace }}/build/Gielinor-Survivors.exe
            ${{ github.workspace }}/build/Gielinor-Survivors.pck
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/Gielinor-Survivors.exe
            build/Gielinor-Survivors.pck
