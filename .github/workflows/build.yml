name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Export Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 stable and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Resolve and verify Godot executable
        shell: pwsh
        run: |
          $godotInstallDir = Join-Path $env:USERPROFILE "godot"
          $godotExecutable = Get-ChildItem -LiteralPath $godotInstallDir -Filter "Godot_v4.7.2-stable_win64.exe" -File | Select-Object -First 1
          if ($null -eq $godotExecutable) {
            throw "Godot 4.7.2 executable was not found in $godotInstallDir."
          }

          $godotExePath = $godotExecutable.FullName
          Write-Host "Using Godot executable: $godotExePath"

          $godotVersion = & $godotExePath --version
          $versionExitCode = $LASTEXITCODE
          if ($versionExitCode -ne 0) {
            throw "Godot version check failed with exit code $versionExitCode."
          }

          $godotVersionText = ($godotVersion | Out-String).Trim()
          Write-Host "Godot version: $godotVersionText"
          if ($godotVersionText -notmatch "^4[.]7[.]2") {
            throw "Expected Godot 4.7.2 stable but found $godotVersionText."
          }

          "GS_GODOT_EXE=$godotExePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import project and validate main scene
        shell: pwsh
        run: |
          Write-Host "Importing Godot project..."
          & $env:GS_GODOT_EXE --headless --editor --path . --quit
          $importExitCode = $LASTEXITCODE
          if ($importExitCode -ne 0) {
            throw "Godot project import failed with exit code $importExitCode."
          }

          Write-Host "Launching main scene headlessly..."
          & $env:GS_GODOT_EXE --headless --path . --quit-after 5
          $sceneExitCode = $LASTEXITCODE
          if ($sceneExitCode -ne 0) {
            throw "The main scene failed to launch headlessly (exit code $sceneExitCode)."
          }

      - name: Export and package Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE

          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build"
          $exe = Join-Path $buildDir "gielinor-survivors.exe"
          $pck = Join-Path $buildDir "gielinor-survivors.pck"
          $package = Join-Path $env:GITHUB_WORKSPACE "gielinor-survivors-windows.zip"

          if (Test-Path -LiteralPath $buildDir) {
            Remove-Item -LiteralPath $buildDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

          Write-Host 'Export command: Godot --headless --path . --export-release "Windows Desktop" build/gielinor-survivors.exe'
          & $env:GS_GODOT_EXE --headless --verbose --path . --export-release "Windows Desktop" "build/gielinor-survivors.exe"
          $exportExitCode = $LASTEXITCODE
          if ($exportExitCode -ne 0) {
            throw "Godot Windows export failed with exit code $exportExitCode."
          }

          Write-Host "Build directory contents after export:"
          Get-ChildItem -LiteralPath $buildDir -Force | Select-Object Name, Length | Format-Table | Out-String | Write-Host

          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Exported executable not found at $exe. Check export_presets.cfg export_path."
          }
          if (!(Test-Path -LiteralPath $pck -PathType Leaf)) {
            throw "Exported game data not found at $pck."
          }

          if (Test-Path -LiteralPath $package) {
            Remove-Item -LiteralPath $package -Force
          }

          Write-Host "Creating gielinor-survivors-windows.zip from the build folder..."
          Compress-Archive -Path (Join-Path $buildDir "*") -DestinationPath $package -CompressionLevel Optimal -Force
          if (!(Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "Windows package ZIP was not created at $package."
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP "gielinor-survivors-package-check"
          if (Test-Path -LiteralPath $verifyDir) {
            Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $package -DestinationPath $verifyDir -Force

          foreach ($fileName in @("gielinor-survivors.exe", "gielinor-survivors.pck")) {
            $verifiedFile = Join-Path $verifyDir $fileName
            if (!(Test-Path -LiteralPath $verifiedFile -PathType Leaf)) {
              throw "Package validation failed; missing $fileName."
            }
          }

          Write-Host "Verified package:"
          Get-Item -LiteralPath $package | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          Get-FileHash -LiteralPath $package -Algorithm SHA256 | Format-Table | Out-String | Write-Host

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gielinor-survivors-windows
          path: gielinor-survivors-windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: gielinor-survivors-windows.zip
