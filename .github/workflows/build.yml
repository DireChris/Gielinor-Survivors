name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Export Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 stable and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Resolve and verify Godot executable
        shell: pwsh
        run: |
          $godotInstallDir = Join-Path $env:USERPROFILE "godot"
          $godotExecutable = Get-ChildItem -LiteralPath $godotInstallDir -Filter "Godot_v4.7.2-stable_win64.exe" -File | Select-Object -First 1
          if ($null -eq $godotExecutable) {
            throw "Godot 4.7.2 executable was not found in $godotInstallDir."
          }

          $godotExePath = $godotExecutable.FullName
          Write-Host "Using Godot executable: $godotExePath"

          $versionStdout = Join-Path $env:RUNNER_TEMP "godot-version.stdout.log"
          $versionStderr = Join-Path $env:RUNNER_TEMP "godot-version.stderr.log"
          $versionProcess = Start-Process -FilePath $godotExePath -ArgumentList "--version" -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru -NoNewWindow -RedirectStandardOutput $versionStdout -RedirectStandardError $versionStderr
          if ($versionProcess.ExitCode -ne 0) {
            throw "Godot version check failed with exit code $($versionProcess.ExitCode)."
          }

          $versionParts = @()
          if (Test-Path -LiteralPath $versionStdout) { $versionParts += Get-Content -LiteralPath $versionStdout }
          if (Test-Path -LiteralPath $versionStderr) { $versionParts += Get-Content -LiteralPath $versionStderr }
          $godotVersionText = ($versionParts -join " ").Trim()
          Write-Host "Godot version: $godotVersionText"
          if ($godotVersionText -notmatch "^4[.]7[.]2") {
            throw "Expected Godot 4.7.2 stable but found $godotVersionText."
          }

          "GS_GODOT_EXE=$godotExePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import project and validate main scene
        shell: pwsh
        run: |
          $importStdout = Join-Path $env:RUNNER_TEMP "godot-import.stdout.log"
          $importStderr = Join-Path $env:RUNNER_TEMP "godot-import.stderr.log"
          Write-Host "Importing Godot project..."
          $importProcess = Start-Process -FilePath $env:GS_GODOT_EXE -ArgumentList "--headless --editor --path . --quit" -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru -NoNewWindow -RedirectStandardOutput $importStdout -RedirectStandardError $importStderr
          if (Test-Path -LiteralPath $importStdout) { Get-Content -LiteralPath $importStdout | ForEach-Object { Write-Host $_ } }
          if (Test-Path -LiteralPath $importStderr) { Get-Content -LiteralPath $importStderr | ForEach-Object { Write-Host $_ } }
          if ($importProcess.ExitCode -ne 0) {
            throw "Godot project import failed with exit code $($importProcess.ExitCode)."
          }

          foreach ($logPath in @($importStdout, $importStderr)) {
            if (Test-Path -LiteralPath $logPath) {
              $logText = Get-Content -LiteralPath $logPath -Raw
              if ($logText -match '(?im)(SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|ERROR: Failed to load resource)') {
                throw "Godot reported a script or resource error during project import. See $logPath."
              }
            }
          }

          $sceneStdout = Join-Path $env:RUNNER_TEMP "godot-scene.stdout.log"
          $sceneStderr = Join-Path $env:RUNNER_TEMP "godot-scene.stderr.log"
          Write-Host "Launching main scene headlessly..."
          $sceneProcess = Start-Process -FilePath $env:GS_GODOT_EXE -ArgumentList "--headless --path . --quit-after 5" -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru -NoNewWindow -RedirectStandardOutput $sceneStdout -RedirectStandardError $sceneStderr
          if (Test-Path -LiteralPath $sceneStdout) { Get-Content -LiteralPath $sceneStdout | ForEach-Object { Write-Host $_ } }
          if (Test-Path -LiteralPath $sceneStderr) { Get-Content -LiteralPath $sceneStderr | ForEach-Object { Write-Host $_ } }
          if ($sceneProcess.ExitCode -ne 0) {
            throw "The main scene failed to launch headlessly (exit code $($sceneProcess.ExitCode))."
          }

          foreach ($logPath in @($sceneStdout, $sceneStderr)) {
            if (Test-Path -LiteralPath $logPath) {
              $logText = Get-Content -LiteralPath $logPath -Raw
              if ($logText -match '(?im)(SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|ERROR: Failed to load resource)') {
                throw "Godot reported a script or resource error while launching the main scene. See $logPath."
              }
            }
          }

      - name: Export and package Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE

          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build"
          $exe = Join-Path $buildDir "gielinor-survivors.exe"
          $pck = Join-Path $buildDir "gielinor-survivors.pck"
          $package = Join-Path $env:GITHUB_WORKSPACE "gielinor-survivors-windows.zip"

          if (Test-Path -LiteralPath $buildDir) {
            Remove-Item -LiteralPath $buildDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

          $exportStdout = Join-Path $env:RUNNER_TEMP "godot-export.stdout.log"
          $exportStderr = Join-Path $env:RUNNER_TEMP "godot-export.stderr.log"
          Write-Host 'Export command: Godot --headless --path . --export-release "Windows Desktop" build/gielinor-survivors.exe'
          $exportProcess = Start-Process -FilePath $env:GS_GODOT_EXE -ArgumentList '--headless --verbose --path . --export-release "Windows Desktop" "build/gielinor-survivors.exe"' -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru -NoNewWindow -RedirectStandardOutput $exportStdout -RedirectStandardError $exportStderr
          if (Test-Path -LiteralPath $exportStdout) { Get-Content -LiteralPath $exportStdout | ForEach-Object { Write-Host $_ } }
          if (Test-Path -LiteralPath $exportStderr) { Get-Content -LiteralPath $exportStderr | ForEach-Object { Write-Host $_ } }
          if ($exportProcess.ExitCode -ne 0) {
            throw "Godot Windows export failed with exit code $($exportProcess.ExitCode)."
          }

          Write-Host "Build directory contents after export:"
          Get-ChildItem -LiteralPath $buildDir -Force | Select-Object Name, Length | Format-Table | Out-String | Write-Host

          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Exported executable not found at $exe. Check export_presets.cfg export_path."
          }
          if (!(Test-Path -LiteralPath $pck -PathType Leaf)) {
            throw "Exported game data not found at $pck."
          }

          if (Test-Path -LiteralPath $package) {
            Remove-Item -LiteralPath $package -Force
          }

          Write-Host "Creating gielinor-survivors-windows.zip from the build folder..."
          Compress-Archive -Path (Join-Path $buildDir "*") -DestinationPath $package -CompressionLevel Optimal -Force
          if (!(Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "Windows package ZIP was not created at $package."
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP "gielinor-survivors-package-check"
          if (Test-Path -LiteralPath $verifyDir) {
            Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $package -DestinationPath $verifyDir -Force

          foreach ($fileName in @("gielinor-survivors.exe", "gielinor-survivors.pck")) {
            $verifiedFile = Join-Path $verifyDir $fileName
            if (!(Test-Path -LiteralPath $verifiedFile -PathType Leaf)) {
              throw "Package validation failed; missing $fileName."
            }
          }

          Write-Host "Verified package:"
          Get-Item -LiteralPath $package | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          Get-FileHash -LiteralPath $package -Algorithm SHA256 | Format-Table | Out-String | Write-Host

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gielinor-survivors-windows
          # Upload the exported files directly. GitHub creates the download ZIP,
          # so uploading our own ZIP here would create a ZIP inside a ZIP.
          path: build/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: gielinor-survivors-windows.zip
